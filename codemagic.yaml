# Codemagic CI — Yurt Simülatör (Capacitor)
#
# Neden: Windows'ta Xcode yok → iOS derleme/imzalama bulutta (macOS runner) yapılır.
# ios/ native projesi REPO'DA DEĞİL; her build'de `npx cap add ios` ile üretilir
# (native tarafta elle yazılmış dosyamız yok, capacitor.config.ts tek kaynak).
#
# İki workflow:
#   ios-testflight → imzalı .ipa + TestFlight'a yükleme (Apple Developer hesabı gerekir)
#   ios-unsigned   → imzasız derleme; "proje gerçekten derleniyor mu" kontrolü (hesap gerekmez)
#
# Codemagic UI'da bir kerelik kurulum için: README.md → "Codemagic (iOS bulut derleme)".

definitions:
  # Her iki workflow'un ortak adımları. YAML anchor'ları ile paylaşılıyor.
  scripts:
    - &npm_install
      name: Bağımlılıklar (npm ci)
      script: npm ci

    - &build_www
      name: webDir montajı (www/)
      script: npm run build:www

    - &add_ios
      name: iOS native projesini üret (npx cap add ios)
      script: |
        set -e
        if [ -d "ios" ]; then
          npx cap sync ios
        else
          npx cap add ios      # add zaten sync + pod install yapar
        fi

    - &gen_assets
      name: App ikonu + splash (capacitor-assets)
      script: npx capacitor-assets generate --ios

workflows:
  # ---------------------------------------------------------------------------
  # 1) İMZALI — App Store Connect / TestFlight
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: iOS · TestFlight (imzalı)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # ⚠️ Codemagic UI → Teams/Personal account → Integrations → App Store Connect
      # bölümünde oluşturduğun API key'in ADI birebir buraya yazılmalı.
      app_store_connect: YurtSim ASC

    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        # Bu blok build'den ÖNCE sertifika+profili çeker ve keychain'e kurar.
        # Profili Xcode projesine uygulamak (`xcode-project use-profiles`) aşağıda,
        # `cap add ios` projeyi ÜRETTİKTEN SONRA yapılır — sıra önemli.
        distribution_type: app_store
        bundle_identifier: com.onurra.yurtsim
      vars:
        BUNDLE_ID: "com.onurra.yurtsim"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    # Elle tetiklenir (Start new build). Her push'ta derlemek istersen aç:
    # triggering:
    #   events: [push]
    #   branch_patterns:
    #     - pattern: main
    #       include: true

    scripts:
      - *npm_install
      - *build_www
      - *add_ios
      - *gen_assets

      - name: İmzalama profillerini Xcode projesine uygula
        script: xcode-project use-profiles --project "ios/App/App.xcodeproj"

      - name: Build numarası
        script: |
          set -e
          # Codemagic'in artan build sayacı → TestFlight için benzersiz ve monoton.
          # Alternatif (TestFlight'taki son numaranın +1'i, App'in Apple ID'si gerekir):
          #   NEW=$(($(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID") + 1))
          cd ios/App
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: .ipa derle (imzalı)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # İç test grubuna otomatik dağıtmak istersen (grup Codemagic'te değil ASC'de tanımlı olmalı):
        # beta_groups:
        #   - Onur
        submit_to_app_store: false
      email:
        recipients:
          - ilginonur1905@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 2) İMZASIZ — sadece "derleniyor mu?" kontrolü (Apple hesabı gerekmez)
  # ---------------------------------------------------------------------------
  ios-unsigned:
    name: iOS · imzasız derleme (doğrulama)
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - *npm_install
      - *build_www
      - *add_ios
      - *gen_assets

      - name: Xcode build (imzasız)
        script: |
          set -e
          xcodebuild \
            -workspace "ios/App/App.xcworkspace" \
            -scheme "App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "build/ios-dd" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: .ipa paketle (imzasız — cihaza KURULAMAZ)
        script: |
          set -e
          APP="build/ios-dd/Build/Products/Release-iphoneos/App.app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa && zip -qry ../YurtSim-unsigned.ipa Payload

    artifacts:
      - build/*.ipa
      - /tmp/xcodebuild_*.log

    publishing:
      email:
        recipients:
          - ilginonur1905@gmail.com
        notify:
          success: true
          failure: true
