# Codemagic CI — Yurt Simülatör (Capacitor)
#
# Neden: Windows'ta Xcode yok → iOS derleme/imzalama bulutta (macOS runner) yapılır.
# ios/ native projesi REPO'DA DEĞİL; her build'de `npx cap add ios` ile üretilir
# (native tarafta elle yazılmış dosyamız yok, capacitor.config.json tek kaynak).
#
# İki workflow:
#   ios-testflight → imzalı .ipa + TestFlight'a yükleme (Apple Developer hesabı gerekir)
#   ios-unsigned   → imzasız derleme; "proje gerçekten derleniyor mu" kontrolü (hesap gerekmez)
#
# Codemagic UI'da bir kerelik kurulum için: README.md → "Codemagic (iOS bulut derleme)".

definitions:
  # Her iki workflow'un ortak adımları. YAML anchor'ları ile paylaşılıyor.
  scripts:
    - &node_check
      name: Node sürümü (>=22 zorunlu)
      script: |
        set -e
        # Capacitor 8 CLI Node >=22 ister. `environment.node` genelde bunu halleder,
        # ama makinede eski sürüm aktif kalırsa `npx cap add ios` "[fatal] The Capacitor
        # CLI requires NodeJS >=22.0.0" ile patlar. Burada garantiye alıyoruz.
        MAJOR=$(node -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)
        echo "Aktif Node: $(node -v 2>/dev/null || echo 'yok') (major=$MAJOR)"
        if [ "$MAJOR" -lt 22 ]; then
          echo "→ Node 22'ye geçiliyor (nvm)."
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            echo "HATA: Node $MAJOR ve nvm bulunamadı ($NVM_DIR). Capacitor 8 için Node>=22 şart."
            exit 1
          fi
          # shellcheck disable=SC1090
          . "$NVM_DIR/nvm.sh"
          nvm install 22
          nvm use 22
          nvm alias default 22
          # Sonraki build adımları ayrı shell'de çalışır → PATH'i kalıcı yaz.
          NODE22_BIN=$(dirname "$(nvm which 22)")
          echo "PATH=$NODE22_BIN:$PATH" >> "$CM_ENV"
          export PATH="$NODE22_BIN:$PATH"
        fi
        node -v
        npm -v

    - &npm_install
      name: Bağımlılıklar (npm ci)
      script: npm ci

    - &build_www
      name: webDir montajı (www/)
      script: npm run build:www

    - &add_ios
      name: iOS native projesini üret (npx cap add ios)
      script: |
        set -e
        if [ -d "ios" ]; then
          npx cap sync ios
        else
          npx cap add ios      # add zaten sync + pod install yapar
        fi

    - &gen_assets
      name: App ikonu + splash (capacitor-assets)
      script: npx capacitor-assets generate --ios

    - &inject_plist
      name: AdMob Info.plist anahtarları (GADApplicationIdentifier + ATT)
      script: |
        set -e
        # ios/ repoda yok (her build'de üretiliyor) → Info.plist'i elle commit'lemek
        # mümkün değil, bu yüzden anahtarlar burada enjekte ediliyor.
        # GADApplicationIdentifier eksikse Google SDK uygulamayı açılışta ÇÖKERTİR,
        # o yüzden script hata durumunda exit 1 verir (sessizce geçmez).
        node build/ios-plist.js

    - &detect_xcode_target
      name: Xcode hedefini tespit et (workspace mı project mi)
      script: |
        set -e
        # Capacitor 8 CLI iOS projesini SPM şablonundan üretiyor
        # (cli/dist/config.js → 'ios-spm-template.tar.gz'): Podfile ve
        # App.xcworkspace YOK, sadece App.xcodeproj + CapApp-SPM/Package.swift.
        # Eski (CocoaPods) şablonunda ise workspace vardı. İkisinde de çalışsın
        # diye hedefi burada tespit edip sonraki adımlara aktarıyoruz.
        echo "--- ios/ ağacı ---"
        find ios -maxdepth 3 -name "*.xcworkspace" -o -maxdepth 3 -name "*.xcodeproj" -o -maxdepth 3 -name "Podfile" -o -maxdepth 3 -name "Package.swift" || true

        # CocoaPods şablonuna düşülürse: workspace ancak pod install sonrası tam olur.
        if [ -f "ios/App/Podfile" ] && [ ! -d "ios/App/App.xcworkspace" ]; then
          echo "→ Podfile var ama workspace yok; pod install çalıştırılıyor."
          (cd ios/App && pod install --repo-update)
        fi

        if [ -d "ios/App/App.xcworkspace" ]; then
          KIND="workspace"; TARGET="ios/App/App.xcworkspace"
        elif [ -d "ios/App/App.xcodeproj" ]; then
          KIND="project";   TARGET="ios/App/App.xcodeproj"
        else
          echo "HATA: ios/App altında ne .xcworkspace ne .xcodeproj var — cap add ios başarısız olmuş."
          ls -la ios/App || true
          exit 1
        fi

        echo "→ Xcode hedefi: $KIND = $TARGET"
        echo "XC_TARGET_KIND=$KIND" >> "$CM_ENV"
        echo "XC_TARGET_PATH=$TARGET" >> "$CM_ENV"

        # Şema gerçekten var mı (scheme adı 'App' bekleniyor). Şema bulunamazsa
        # build adımı anlaşılmaz bir hata verir; burada logda görünsün.
        echo "--- xcodebuild -list ---"
        xcodebuild -list "-$KIND" "$TARGET" 2>&1 | tee /tmp/xc_list.txt || true
        grep -qE "^[[:space:]]*App[[:space:]]*$" /tmp/xc_list.txt \
          || echo "⚠️  'App' şeması listede görünmüyor — yukarıdaki şema listesine bak."

workflows:
  # ---------------------------------------------------------------------------
  # 1) İMZALI — App Store Connect / TestFlight
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: iOS · TestFlight (imzalı)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # ⚠️ Codemagic UI → Teams/Personal account → Integrations → App Store Connect
      # bölümünde oluşturduğun API key'in ADI birebir buraya yazılmalı.
      app_store_connect: YurtSim ASC

    environment:
      # ⚠️ Codemagic'te bir env var GRUBA konduysa, workflow o grubu BURADA import
      # etmedikçe build içinde GÖRÜNMEZ (tanımsız gibi davranır). CERTIFICATE_PRIVATE_KEY
      # "yurtsim" grubunda olduğu için bu satır zorunlu — yoksa script anahtarı
      # bulamayıp her build'de yeni sertifika üretmeye çalışır ve Apple'ın dağıtım
      # sertifikası limitine takılır ("409: You already have a current Distribution
      # certificate"). Grup adı Codemagic UI'daki adla BİREBİR aynı olmalı.
      groups:
        - yurtsim
      node: 22          # Capacitor 8 CLI >=22 ister (20 ile `npx cap add ios` patlıyor)
      xcode: latest
      cocoapods: default
      # ⚠️ `ios_signing:` bloğu BİLEREK YOK.
      # O blok build başlamadan önce çalışır ve SADECE var olan profili arar; hesapta
      # App Store profili yoksa "No matching profiles found for bundle identifier ...
      # and distribution type app_store" ile daha scripts'e gelmeden patlar.
      # Bunun yerine imzalama aşağıda elle, `--create` ile yapılıyor (yoksa oluşturur).
      vars:
        BUNDLE_ID: "com.onurra.yurtsim"
        XCODE_SCHEME: "App"
        # Reklam kimlik seti: test (Google test birimleri) | prod (gerçek).
        # Hem web tarafını (build/www.js → src/ads.js) hem Info.plist'i (build/ios-plist.js)
        # birlikte belirler; ikisi ayrışamaz. TestFlight'ta gerçek reklam denemek
        # istediğinde "prod" yap. VARSAYILAN BİLEREK test.
        ADS_ENV: "test"
        # Not: workspace/project yolu sabit DEĞİL — `detect_xcode_target` adımı
        # XC_TARGET_KIND + XC_TARGET_PATH olarak runtime'da belirliyor.

    # Elle tetiklenir (Start new build). Her push'ta derlemek istersen aç:
    # triggering:
    #   events: [push]
    #   branch_patterns:
    #     - pattern: main
    #       include: true

    scripts:
      - *node_check
      - *npm_install
      - *build_www
      - *add_ios
      - *gen_assets
      - *inject_plist
      - *detect_xcode_target

      - name: Kod imzalama (sertifika/profil yoksa OLUŞTUR)
        script: |
          set -e
          # Bu adım `cap add ios`tan SONRA olmak zorunda: use-profiles üretilmiş
          # Xcode projesini düzenler.
          keychain initialize

          # --- Sertifika özel anahtarı --------------------------------------
          # Apple hesabında en fazla 2-3 dağıtım sertifikası olabilir. fetch-signing-files
          # var olan sertifikayı ancak ELİNDEKİ ÖZEL ANAHTARLA eşleşiyorsa yeniden kullanır.
          # Bu yüzden: anahtarı bir kez üretip Codemagic'te CERTIFICATE_PRIVATE_KEY
          # (secure env var) olarak saklamak ÖNERİLİR — bkz. README.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            CERT_KEY_ARG="@env:CERTIFICATE_PRIVATE_KEY"
            echo "→ CERTIFICATE_PRIVATE_KEY bulundu (mevcut sertifika yeniden kullanılacak)."
          elif [ "$ALLOW_NEW_CERT" = "true" ]; then
            # Bilinçli kaçış yolu: hesapta HİÇ dağıtım sertifikası yokken ilk kurulum.
            openssl genrsa -out /tmp/asc_cert_key.pem 2048
            CERT_KEY_ARG="@file:/tmp/asc_cert_key.pem"
            echo "⚠️  ALLOW_NEW_CERT=true → yeni özel anahtar üretildi, YENİ sertifika oluşabilir."
            echo "⚠️  Build bitince bu anahtarı CERTIFICATE_PRIVATE_KEY olarak kaydet, yoksa"
            echo "⚠️  sonraki build yine yenisini üretmeye çalışır."
          else
            # ESKİDEN: burada sessizce geçici anahtar üretiliyordu. Sonuç: her build yeni
            # sertifika denemesi → Apple limiti dolunca "409: You already have a current
            # Distribution certificate". Üstelik o sertifikaların özel anahtarı /tmp'de
            # kaldığı için bir daha KULLANILAMIYOR. Artık sessizce devam etmek yerine
            # burada duruyoruz: bir slot daha yakmak, build'i düşürmekten pahalı.
            echo "HATA: CERTIFICATE_PRIVATE_KEY tanımlı değil."
            echo ""
            echo "Muhtemel sebep: değişken Codemagic'te bir GRUBA eklenmiş ama bu workflow"
            echo "o grubu import etmiyor. Kontrol et: codemagic.yaml → environment.groups"
            echo "listesindeki ad, Codemagic UI'daki grup adıyla BİREBİR aynı mı?"
            echo "(Bu workflow şu grupları import ediyor: yurtsim)"
            echo ""
            echo "Değişkeni gruba değil doğrudan app'e eklediysen grup import'u gerekmez;"
            echo "o durumda adının tam olarak CERTIFICATE_PRIVATE_KEY olduğunu doğrula."
            echo ""
            echo "Hesapta gerçekten hiç dağıtım sertifikası yoksa ve yeni üretilmesini"
            echo "İSTİYORSAN: ALLOW_NEW_CERT=true env var'ı ile bu build'i tekrar başlat."
            exit 1
          fi

          # Bundle ID kayıtlı değilse kaydeder, sertifika yoksa üretir, App Store
          # profili yoksa oluşturur; hepsini indirir.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key "$CERT_KEY_ARG" \
            --create

          # İndirilen sertifikaları keychain'e ekle, profilleri projeye uygula.
          keychain add-certificates
          xcode-project use-profiles --project "ios/App/App.xcodeproj"

      - name: Build numarası
        script: |
          set -e
          # Codemagic'in artan build sayacı → TestFlight için benzersiz ve monoton.
          # Alternatif (TestFlight'taki son numaranın +1'i, App'in Apple ID'si gerekir):
          #   NEW=$(($(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID") + 1))
          cd ios/App
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: .ipa derle (imzalı)
        script: |
          set -e
          # Hedef bayrağı detect_xcode_target'tan geliyor:
          #   Capacitor 8 (SPM)      → --project ios/App/App.xcodeproj
          #   CocoaPods şablonu ise  → --workspace ios/App/App.xcworkspace
          xcode-project build-ipa \
            "--$XC_TARGET_KIND" "$XC_TARGET_PATH" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # İç test grubuna otomatik dağıtmak istersen (grup Codemagic'te değil ASC'de tanımlı olmalı):
        # beta_groups:
        #   - Onur
        submit_to_app_store: false
      email:
        recipients:
          - ilginonur1905@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 2) İMZASIZ — sadece "derleniyor mu?" kontrolü (Apple hesabı gerekmez)
  # ---------------------------------------------------------------------------
  ios-unsigned:
    name: iOS · imzasız derleme (doğrulama)
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      node: 22          # Capacitor 8 CLI >=22 ister
      xcode: latest
      cocoapods: default
      vars:
        ADS_ENV: "test"   # doğrulama derlemesi → hep test reklamları

    scripts:
      - *node_check
      - *npm_install
      - *build_www
      - *add_ios
      - *gen_assets
      - *inject_plist
      - *detect_xcode_target

      - name: Xcode build (imzasız)
        script: |
          set -e
          # xcodebuild tek tire kullanır: -project / -workspace
          xcodebuild \
            "-$XC_TARGET_KIND" "$XC_TARGET_PATH" \
            -scheme "App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "build/ios-dd" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: .ipa paketle (imzasız — cihaza KURULAMAZ)
        script: |
          set -e
          APP="build/ios-dd/Build/Products/Release-iphoneos/App.app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa && zip -qry ../YurtSim-unsigned.ipa Payload

    artifacts:
      - build/*.ipa
      - /tmp/xcodebuild_*.log

    publishing:
      email:
        recipients:
          - ilginonur1905@gmail.com
        notify:
          success: true
          failure: true
